name: Build and Release APK

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger on version tags like v1.0.0

jobs:
  build:
    runs-on: ubuntu-latest

    # The default GITHUB_TOKEN is read-only when the repo's workflow
    # permissions are set to "read repository contents". Creating a release
    # and uploading the APK both need write access, without this the build
    # succeeds and the "Create Release" step 403s at the very last step.
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        # Must satisfy pubspec.yaml's `sdk: ^3.10.4`. The previous pin of
        # 3.24.0 ships Dart 3.5, so `flutter pub get` failed version solving
        # before a single file was compiled. Keep this in step with the SDK
        # constraint. Bumping one without the other breaks CI only, which is
        # the slowest place to find out.
        flutter-version: '3.44.5'
        channel: 'stable'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v4

    - name: Accept Android licenses
      run: yes | sdkmanager --licenses

    - name: Display available Android SDKs
      run: sdkmanager --list

    - name: Install dependencies
      run: flutter pub get

    - name: Build APK
      run: flutter build apk --release

    - name: Rename APK with version
      run: |
        VERSION=$(echo ${{ github.ref_name }} | sed 's/v//')
        mv build/app/outputs/flutter-apk/app-release.apk InstaFrame-v${VERSION}.apk

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        files: InstaFrame-v*.apk
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
